<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 404 — Personal Training Caulfield South</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        copper: '#B87333',
                        'copper-dark': '#9A6B2A',
                        dark: '#1C1C1E',
                        light: '#FAFAF7'
                    },
                    fontFamily: {
                        heading: ['Barlow Condensed', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'DM Sans', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #B87333 0%, #D4A574 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-dark text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, useScroll, useTransform, AnimatePresence } = window.Motion;

        const ScrollProgress = () => {
            const { scrollYProgress } = useScroll();
            const scaleX = useTransform(scrollYProgress, [0, 1], [0, 1]);
            return (
                <motion.div
                    className="fixed top-0 left-0 right-0 h-1 bg-copper z-50 origin-left"
                    style={{ scaleX }}
                />
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    transition={{ duration: 0.6, ease: "easeOut" }}
                    className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 ${scrolled ? 'bg-dark/95 backdrop-blur-md py-4' : 'bg-transparent py-6'}`}
                >
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <motion.div 
                            whileHover={{ scale: 1.05 }}
                            className="font-heading text-2xl font-bold"
                        >
                            Studio <span className="text-copper">404</span>
                        </motion.div>
                        <motion.a
                            href="tel:[PHONE]"
                            whileHover={{ scale: 1.05, color: '#B87333' }}
                            className="text-sm text-gray-400 hover:text-copper transition-colors"
                        >
                            [PHONE]
                        </motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            return (
                <section className="min-h-screen flex items-center relative overflow-hidden pt-20">
                    <div className="absolute inset-0 bg-gradient-to-br from-dark via-dark to-copper/10"></div>
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
                        <div className="order-2 md:order-1">
                            <motion.div
                                initial={{ opacity: 0, y: 30 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 0.8, delay: 0.2 }}
                            >
                                <p className="text-copper font-semibold tracking-widest text-sm mb-4">CAULFIELD SOUTH · 5.0★</p>
                                <h1 className="font-heading text-5xl md:text-7xl font-bold leading-none mb-6">
                                    Personal Training That<br/>
                                    <span className="gradient-text">Actually Works</span>
                                </h1>
                                <p className="text-xl text-gray-400 mb-8 max-w-lg">
                                    One-on-one coaching in Caulfield South. No crowds, no guesswork, just results.
                                </p>
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.05, y: -2 }}
                                    whileTap={{ scale: 0.98 }}
                                    className="inline-block bg-copper text-white px-8 py-4 rounded-lg font-semibold text-lg shadow-lg shadow-copper/25"
                                >
                                    Book a Free Consultation
                                </motion.a>
                            </motion.div>
                        </div>
                        
                        <div className="order-1 md:order-2">
                            <motion.div
                                initial={{ opacity: 0, scale: 0.9, rotateY: 15 }}
                                animate={{ opacity: 1, scale: 1, rotateY: 0 }}
                                transition={{ duration: 1, delay: 0.4 }}
                                whileHover={{ scale: 1.02, rotateY: -5 }}
                                className="relative"
                            >
                                <div className="absolute -inset-4 bg-copper/20 rounded-2xl blur-2xl"></div>
                                <img 
                                    src="../images/studio-404-hero.jpg" 
                                    alt="Personal training"
                                    className="relative rounded-2xl shadow-2xl w-full h-[500px] object-cover"
                                />
                                <motion.div
                                    initial={{ opacity: 0, x: 20 }}
                                    animate={{ opacity: 1, x: 0 }}
                                    transition={{ delay: 1, duration: 0.6 }}
                                    className="absolute -bottom-6 -left-6 bg-white text-dark p-6 rounded-xl shadow-xl"
                                >
                                    <p className="font-heading text-4xl font-bold text-copper">10+</p>
                                    <p className="text-sm text-gray-600">5-Star Reviews</p>
                                </motion.div>
                            </motion.div>
                        </div>
                    </div>
                </section>
            );
        };

        const Services = () => {
            const services = [
                { num: "01", title: "1-on-1 Personal Training", desc: "Custom workouts designed for your body, your goals, and your schedule." },
                { num: "02", title: "Small Group Training", desc: "Train with 2-4 people. Same attention, lower cost, more motivation." },
                { num: "03", title: "Online Coaching", desc: "Programs, nutrition guidance, and weekly check-ins wherever you are." },
                { num: "04", title: "Goal-Focused Blocks", desc: "8-week transformations for weddings, events, or hitting that milestone." }
            ];

            return (
                <section className="py-24 bg-light">
                    <div className="max-w-6xl mx-auto px-6">
                        <motion.h2
                            initial={{ opacity: 0, y: 20 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            className="font-heading text-4xl md:text-5xl font-bold text-dark mb-16"
                        >
                            How We Train <span className="text-copper">You</span>
                        </motion.h2>
                        
                        <div className="space-y-6">
                            {services.map((service, i) => (
                                <motion.div
                                    key={service.num}
                                    initial={{ opacity: 0, x: -50 }}
                                    whileInView={{ opacity: 1, x: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.1 }}
                                    whileHover={{ x: 20, backgroundColor: 'rgba(184,115,51,0.05)' }}
                                    className="grid md:grid-cols-[100px_1fr] gap-6 p-6 rounded-xl transition-colors cursor-pointer border-l-4 border-transparent hover:border-copper"
                                >
                                    <span className="font-heading text-6xl font-bold text-copper/30">{service.num}</span>
                                    <div>
                                        <h3 className="font-heading text-2xl font-bold text-dark mb-2">{service.title}</h3>
                                        <p className="text-gray-600 text-lg">{service.desc}</p>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section className="py-24 bg-dark relative overflow-hidden">
                    <motion.div
                        animate={{ rotate: 360 }}
                        transition={{ duration: 100, repeat: Infinity, ease: "linear" }}
                        className="absolute -right-64 -top-64 w-[600px] h-[600px] rounded-full border border-copper/10"
                    />
                    
                    <div className="max-w-4xl mx-auto px-6 text-center relative z-10">
                        <motion.div
                            initial={{ opacity: 0, scale: 0.9 }}
                            whileInView={{ opacity: 1, scale: 1 }}
                            viewport={{ once: true }}
                        >
                            <h2 className="font-heading text-4xl md:text-5xl font-bold mb-8">
                                About <span className="text-copper">Studio 404</span>
                            </h2>
                            <p className="text-xl text-gray-400 mb-6">
                                We're not a big gym. We're a dedicated training space in Caulfield South where you get real results without the crowds, the waiting, or the guesswork.
                            </p>
                            <p className="text-xl text-gray-400">
                                Every client gets a program built for their body, their schedule, and their goals.
                            </p>
                            <motion.div
                                whileHover={{ scale: 1.1 }}
                                className="inline-flex items-center gap-2 mt-8 text-copper"
                            >
                                <span>📍</span> Caulfield South, Melbourne
                            </motion.div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="py-24 bg-copper">
                    <div className="max-w-4xl mx-auto px-6 text-center">
                        <motion.div
                            initial={{ opacity: 0, y: 30 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                        >
                            <h2 className="font-heading text-5xl font-bold text-white mb-4">Ready to Start?</h2>
                            <p className="text-xl text-white/80 mb-12">Book a free consultation. No commitment, just a conversation.</p>
                            
                            <motion.a
                                href="tel:[PHONE]"
                                whileHover={{ scale: 1.05, y: -5 }}
                                whileTap={{ scale: 0.98 }}
                                className="inline-block bg-white text-copper px-10 py-5 rounded-xl font-bold text-xl shadow-2xl"
                            >
                                Call Now
                            </motion.a>
                            
                            <p className="mt-8 text-white/60">[PHONE] · Caulfield South</p>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-dark py-8 text-center">
                <p className="text-gray-500">© 2026 Studio 404 Personal Training · Caulfield South</p>
            </footer>
        );

        const App = () => (
            <div>
                <ScrollProgress />
                <Navbar />
                <Hero />
                <Services />
                <About />
                <Contact />
                <Footer />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
