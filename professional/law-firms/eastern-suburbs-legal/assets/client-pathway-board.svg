<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Client pathway board with legal matter routing</title>
  <desc id="desc">An abstract board showing legal matters moving from urgent client states into clear next-step pathways. No people or real firm details are shown.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0A1018" flood-opacity=".22"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F0DF"/><stop offset="1" stop-color="#DDD0B8"/></linearGradient>
  </defs>
  <rect width="1440" height="960" fill="url(#bg)"/>
  <g stroke="#151A22" stroke-opacity=".08"><path d="M0 160h1440M0 320h1440M0 480h1440M0 640h1440M0 800h1440M180 0v960M360 0v960M540 0v960M720 0v960M900 0v960M1080 0v960M1260 0v960"/></g>
  <text x="112" y="130" font-family="Georgia,serif" font-size="72" fill="#10151C">Client pathway board</text>
  <text x="116" y="178" font-family="Arial,sans-serif" font-size="24" fill="#57616D">A stressed visitor should see their situation in seconds.</text>
  <g filter="url(#s)">
    <rect x="100" y="260" width="310" height="410" rx="28" fill="#111820"/>
    <text x="140" y="326" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#B68A35">CLIENT STATE</text>
    <text x="140" y="398" font-family="Georgia,serif" font-size="46" fill="#FBF7EC">Urgent</text>
    <text x="140" y="452" font-family="Arial,sans-serif" font-size="23" fill="#D6CFBF">deadline, contract,</text>
    <text x="140" y="486" font-family="Arial,sans-serif" font-size="23" fill="#D6CFBF">lease, probate.</text>
  </g>
  <g filter="url(#s)">
    <rect x="560" y="230" width="340" height="470" rx="30" fill="#FBF7EC"/>
    <text x="604" y="302" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#B68A35">ROUTER</text>
    <rect x="604" y="352" width="246" height="58" rx="29" fill="#E7DBC4"/><text x="635" y="389" font-family="Arial,sans-serif" font-size="22" fill="#111820">Buying property</text>
    <rect x="604" y="440" width="202" height="58" rx="29" fill="#DCE8EA"/><text x="635" y="477" font-family="Arial,sans-serif" font-size="22" fill="#111820">Lease issue</text>
    <rect x="604" y="528" width="222" height="58" rx="29" fill="#E0E7D8"/><text x="635" y="565" font-family="Arial,sans-serif" font-size="22" fill="#111820">Estate matter</text>
    <path d="M700 638h108" stroke="#111820" stroke-width="5"/><path d="M808 638l-20-15v30z" fill="#111820"/>
  </g>
  <g filter="url(#s)">
    <rect x="1040" y="260" width="300" height="410" rx="28" fill="#111820"/>
    <text x="1080" y="326" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#83AFC9">NEXT STEP</text>
    <text x="1080" y="398" font-family="Georgia,serif" font-size="46" fill="#FBF7EC">Booked</text>
    <text x="1080" y="452" font-family="Arial,sans-serif" font-size="23" fill="#D6CFBF">specific CTA, timing,</text>
    <text x="1080" y="486" font-family="Arial,sans-serif" font-size="23" fill="#D6CFBF">documents, contact.</text>
  </g>
  <path d="M412 465 C498 455 500 455 560 465" stroke="#B68A35" stroke-width="7" fill="none"/>
  <path d="M900 465 C990 455 995 455 1040 465" stroke="#83AFC9" stroke-width="7" fill="none"/>
  <circle cx="486" cy="461" r="13" fill="#B68A35"/><circle cx="972" cy="461" r="13" fill="#83AFC9"/>
</svg>
