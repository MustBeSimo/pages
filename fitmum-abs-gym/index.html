<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitmum_abs — Gym for Mums Richmond</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { coral: '#FF6B6B', teal: '#4ECDC4', dark: '#2C3E50' },
                    fontFamily: { heading: ['Poppins', 'sans-serif'], body: ['Open Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body className="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const FloatingHearts = () => {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev.slice(-5), { id: Date.now(), x: Math.random() * 100 }]);
                }, 2000);
                return () => clearInterval(interval);
            }, []);
            
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    <AnimatePresence>
                        {hearts.map(heart => (
                            <motion.div
                                key={heart.id}
                                initial={{ opacity: 0, y: '100vh', x: `${heart.x}%` }}
                                animate={{ opacity: [0, 1, 0], y: '-10vh' }}
                                exit={{ opacity: 0 }}
                                transition={{ duration: 8, ease: "easeOut" }}
                                className="absolute text-coral/20 text-4xl"
                            >
                                ♥
                            </motion.div>
                        ))}
                    </AnimatePresence>
                </div>
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
            }, []);
            
            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    className={`fixed top-0 left-0 right-0 z-50 transition-all ${scrolled ? 'bg-white shadow-lg py-3' : 'bg-transparent py-5'}`}
                >
                    <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                        <motion.div whileHover={{ scale: 1.1, rotate: [-5, 5, 0] }} className="font-heading text-2xl font-bold text-coral">
                            Fitmum_abs
                        </motion.div>
                        <motion.a href="tel:[PHONE]" whileHover={{ scale: 1.05 }} className="text-dark font-semibold">[PHONE]</motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            return (
                <section className="min-h-screen flex items-center pt-20 relative overflow-hidden bg-gradient-to-br from-coral via-pink-400 to-teal">
                    <FloatingHearts />
                    
                    <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
                        <div>
                            <motion.div
                                initial={{ opacity: 0, x: -50 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ duration: 0.8 }}
                            >
                                <p className="text-white font-semibold mb-4">RICHMOND · 5.0★</p>                                
                                <h1 className="font-heading text-5xl md:text-6xl font-bold text-white leading-tight mb-6">
                                    Fitness for Mums,<br/>
                                    <span className="text-teal">By Mums</span>
                                </h1>
                                
                                <p className="text-xl text-white/90 mb-8">
                                    A Richmond gym designed for mothers. Kid-friendly, judgment-free.
                                </p>
                                
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.1, rotate: 2 }}
                                    whileTap={{ scale: 0.95 }}
                                    className="inline-block bg-white text-coral px-8 py-4 rounded-full font-bold text-lg shadow-xl"
                                >
                                    Book a Free Session
                                </motion.a>
                            </motion.div>
                        </div>
                        
                        <motion.div
                            initial={{ opacity: 0, scale: 0.8 }}
                            animate={{ opacity: 1, scale: 1 }}
                            transition={{ duration: 0.8, delay: 0.3 }}
                            className="relative"
                        >
                            <motion.div
                                animate={{ rotate: 360 }}
                                transition={{ duration: 20, repeat: Infinity, ease: "linear" }}
                                className="absolute -inset-4 bg-white/20 rounded-full blur-xl"
                            />
                            <img src="../images/mum-fitness.jpg" className="relative rounded-3xl shadow-2xl w-full h-[400px] object-cover" />
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Features = () => {
            const features = [
                { title: "Kid-Friendly", desc: "Bring the little ones" },
                { title: "Flexible Hours", desc: "Early morning & evening" },
                { title: "Mum Community", desc: "No judgment, just support" }
            ];
            
            return (
                <section className="py-20 px-6 bg-white">
                    <div className="max-w-5xl mx-auto">
                        <motion.h2
                            initial={{ opacity: 0 }}
                            whileInView={{ opacity: 1 }}
                            viewport={{ once: true }}
                            className="font-heading text-4xl text-center mb-16 text-dark"
                        >
                            Why <span className="text-coral">Fitmum_abs?</span>
                        </motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {features.map((f, i) => (
                                <motion.div
                                    key={f.title}
                                    initial={{ opacity: 0, y: 50 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.2 }}
                                    whileHover={{ y: -10, boxShadow: "0 20px 40px rgba(255,107,107,0.2)" }}
                                    className="bg-gray-50 p-8 rounded-2xl text-center"
                                >
                                    <h3 className="font-heading text-xl text-coral mb-2">{f.title}</h3>
                                    <p className="text-gray-600">{f.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-20 bg-coral text-center">
                <motion.div
                    initial={{ scale: 0.9 }}
                    whileInView={{ scale: 1 }}
                    viewport={{ once: true }}
                >
                    <h2 className="font-heading text-4xl text-white mb-8">Ready to Start?</h2>
                    <motion.a
                        href="tel:[PHONE]"
                        whileHover={{ scale: 1.1 }}
                        whileTap={{ scale: 0.95 }}
                        className="inline-block bg-white text-coral px-10 py-4 rounded-full font-bold text-lg"
                    >
                        Call Now
                    </motion.a>
                </motion.div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <Features />
                <Contact />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
