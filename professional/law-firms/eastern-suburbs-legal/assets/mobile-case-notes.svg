<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Responsive website preview on a phone beside case notes</title>
  <desc id="desc">Abstract phone-shaped responsive website preview next to anonymised case notes. No people, brands, or exact legal firm identifiers.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172232"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#111111" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="#f7f2ea"/>
  <circle cx="1020" cy="145" r="170" fill="#dde8ef" opacity="0.85"/>
  <circle cx="185" cy="675" r="145" fill="#b68a35" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="418" y="74" width="360" height="676" rx="52" fill="#111"/>
    <rect x="446" y="118" width="304" height="588" rx="34" fill="url(#screen)"/>
    <rect x="544" y="92" width="108" height="13" rx="6" fill="#2d2d2d"/>
  </g>
  <g transform="translate(478 164)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill="#e3bc69">MOBILE WEBSITE</text>
    <text x="0" y="62" font-family="Georgia, serif" font-size="48" fill="#fffdf8">What do you</text>
    <text x="0" y="112" font-family="Georgia, serif" font-size="48" fill="#fffdf8">need solved?</text>
    <rect x="0" y="160" width="240" height="62" rx="12" fill="#fffdf8" opacity="0.96"/>
    <rect x="0" y="244" width="240" height="62" rx="12" fill="#dde8ef" opacity="0.96"/>
    <rect x="0" y="328" width="240" height="62" rx="12" fill="#879b88" opacity="0.96"/>
    <rect x="0" y="430" width="240" height="76" rx="16" fill="#b68a35"/>
    <text x="24" y="199" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#111">Property</text>
    <text x="24" y="283" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#111">Lease issue</text>
    <text x="24" y="367" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#111">Estate matter</text>
    <text x="24" y="478" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" fill="#111">Send documents →</text>
  </g>
  <g transform="translate(118 164) rotate(-5)">
    <rect width="285" height="430" rx="12" fill="#fffdf8" stroke="#111" stroke-width="5"/>
    <text x="34" y="62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#111">CASE NOTES</text>
    <path d="M34 118h210M34 172h180M34 226h205M34 280h150" stroke="#111" stroke-width="5" opacity="0.75"/>
    <rect x="34" y="328" width="140" height="46" fill="#dde8ef" stroke="#111" stroke-width="4"/>
  </g>
  <g transform="translate(828 246) rotate(6)">
    <rect width="250" height="335" rx="12" fill="#fdf9ef" stroke="#111" stroke-width="5"/>
    <text x="28" y="62" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3" fill="#111">INTAKE</text>
    <path d="M28 112h182M28 158h142M28 204h168" stroke="#111" stroke-width="5" opacity="0.72"/>
    <circle cx="52" cy="272" r="22" fill="#b68a35" stroke="#111" stroke-width="5"/>
    <path d="M92 272h98" stroke="#111" stroke-width="5"/>
  </g>
</svg>
