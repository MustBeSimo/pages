<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Gen Dashboard | Studio W230</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
            --info: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem 2rem;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 700; }
        .logo span { color: var(--accent); }
        .stats { display: flex; gap: 2rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.75rem; font-weight: 700; }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .site-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .site-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }
        .site-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .site-type {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .site-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--info);
            text-decoration: none;
            font-weight: 500;
        }
        .site-link:hover {
            text-decoration: underline;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        .status-live {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Lead<span>Gen</span> Dashboard</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">2</div>
                    <div class="stat-label">Live Sites</div>
                </div>
                <div class="stat">
                    <div class="stat-value">8</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="sites-grid">
            <div class="site-card">
                <div class="site-name">Joe's Plumbing Co</div>
                <div class="site-type">Plumber · Richmond, VIC</div>
                <a href="joes-plumbing-co/" class="site-link">View Website →</a>
                <div class="status status-live">🟢 Live</div>
            </div>
            
            <div class="site-card">
                <div class="site-name">Fitzroy Electrical</div>
                <div class="site-type">Electrician · Fitzroy, VIC</div>
                <a href="fitzroy-electrical/" class="site-link">View Website →</a>
                <div class="status status-live">🟢 Live</div>
            </div>
        </div>
    </div>
</body>
</html>
