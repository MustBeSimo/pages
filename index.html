<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melbourne Business Websites</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>
  <script type="text/babel">
    const { motion } = window.Motion;
    
    const sites = [
      { emoji: '💪', name: 'Studio 404', category: 'Personal Training', url: '/studio-404-fitness/', color: 'from-orange-500 to-red-500' },
      { emoji: '🤱', name: 'Fitmum_abs', category: 'Gym for Mums', url: '/fitmum-abs-gym/', color: 'from-rose-500 to-pink-500' },
      { emoji: '🥊', name: 'Burn Boxing', category: 'Boxing', url: '/burn-boxing-fitness/', color: 'from-red-600 to-orange-500' },
      { emoji: '🧘', name: 'HiVibe Fitness', category: 'Wellness', url: '/hivibe-fitness/', color: 'from-teal-500 to-emerald-500' },
      { emoji: '🏋️', name: 'Ucebox Fitness', category: 'Functional Training', url: '/ucebox-fitness/', color: 'from-slate-500 to-slate-600' },
      { emoji: '👗', name: 'Lashkara Collections', category: 'Fashion', url: '/lashkara-collections/', color: 'from-purple-600 to-pink-500' },
      { emoji: '👢', name: 'Cowboys Cash & Carry', category: 'Workwear', url: '/cowboys-cash-carry/', color: 'from-amber-600 to-orange-500' },
      { emoji: '👔', name: 'Brandella Uniforms', category: 'Uniforms', url: '/brandella-uniforms/', color: 'from-blue-600 to-indigo-500' },
      { emoji: '🔧', name: "Joe's Plumbing", category: 'Plumber', url: '/joes-plumbing-co/', color: 'from-green-600 to-emerald-500' },
      { emoji: '⚡', name: 'Fitzroy Electrical', category: 'Electrician', url: '/fitzroy-electrical/', color: 'from-yellow-500 to-amber-500' }
    ];

    const App = () => (
      <div className="min-h-screen p-8">
        <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} className="text-center mb-12 pt-8">
          <h1 className="text-4xl md:text-5xl font-bold mb-4">Melbourne Business Websites</h1>
          <p className="text-gray-400 mb-4">AI-generated preview sites with React + Animations</p>
          <div className="inline-block bg-red-500 text-white px-4 py-2 rounded-full text-sm font-medium">🔒 Private Preview</div>
        </motion.div>
        
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl mx-auto">
          {sites.map((site, i) => (
            <motion.div
              key={site.name}
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: i * 0.05 }}
              whileHover={{ scale: 1.02 }}
              className="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-gray-500 transition-colors"
            >
              <div className={`h-32 bg-gradient-to-br ${site.color} flex items-center justify-center text-5xl`}>
                {site.emoji}
              </div>
              <div className="p-5">
                <h3 className="font-semibold text-lg mb-1">{site.name}</h3>
                <p className="text-gray-400 text-sm mb-4">{site.category}</p>
                <a href={site.url} className={`block w-full py-2.5 text-center rounded-lg font-medium bg-gradient-to-r ${site.color} text-white hover:opacity-90 transition-opacity`}>
                  View Site
                </a>
              </div>
            </motion.div>
          ))}
        </div>
        
        <footer className="text-center mt-16 pt-8 border-t border-gray-800 text-gray-500">
          <p>Studio W230 · 2026</p>
        </footer>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
