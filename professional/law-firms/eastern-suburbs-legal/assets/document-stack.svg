<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Abstract legal document stack and intake pathway</title>
  <desc id="desc">Editorial still life of anonymised legal documents, coloured tags, and a pathway line. No people, logos, firm names, or private identifiers.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe4d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#111111" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="#f7f2ea"/>
  <path d="M0 130h1200M0 270h1200M0 410h1200M0 550h1200M0 690h1200M150 0v820M310 0v820M470 0v820M630 0v820M790 0v820M950 0v820" stroke="#d8cec0" stroke-width="1" opacity="0.45"/>
  <g filter="url(#shadow)">
    <rect x="260" y="120" width="610" height="520" rx="8" fill="url(#paper)" stroke="#111" stroke-width="5" transform="rotate(-4 565 380)"/>
    <rect x="320" y="160" width="610" height="520" rx="8" fill="#fffdf8" stroke="#111" stroke-width="5" transform="rotate(3 625 420)"/>
    <rect x="382" y="194" width="520" height="438" rx="6" fill="#fdf9ef" stroke="#111" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="5" opacity="0.9">
    <path d="M430 282h255M430 338h365M430 394h310M430 506h355"/>
    <path d="M430 562h190" opacity="0.55"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="4" font-size="28" fill="#111">
    <text x="430" y="244">CASEFILE</text>
    <text x="718" y="244" fill="#6f6a61">01</text>
  </g>
  <g>
    <rect x="742" y="312" width="118" height="46" fill="#dde8ef" stroke="#111" stroke-width="4"/>
    <rect x="742" y="374" width="118" height="46" fill="#879b88" stroke="#111" stroke-width="4"/>
    <rect x="742" y="436" width="118" height="46" fill="#b68a35" stroke="#111" stroke-width="4"/>
  </g>
  <path d="M248 670C420 690 480 678 558 628c74-48 126-42 224-26 85 14 150-6 216-92" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <circle cx="248" cy="670" r="24" fill="#b68a35" stroke="#111" stroke-width="6"/>
  <circle cx="558" cy="628" r="24" fill="#dde8ef" stroke="#111" stroke-width="6"/>
  <circle cx="998" cy="510" r="24" fill="#879b88" stroke="#111" stroke-width="6"/>
</svg>
