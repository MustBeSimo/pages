<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn Boxing & Fitness — Boxing Gym Craigieburn</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { red: '#DC143C', black: '#0D0D0D', grey: '#1A1A1A' },
                    fontFamily: { display: ['Bebas Neue', 'sans-serif'], body: ['Roboto Condensed', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Roboto Condensed', sans-serif; }
        .glitch { position: relative; }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch::before { animation: glitch-1 2s infinite; color: #DC143C; z-index: -1; }
        .glitch::after { animation: glitch-2 2s infinite; color: #00FFFF; z-index: -2; }
        @keyframes glitch-1 { 0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); } 20% { clip-path: inset(20% 0 30% 0); transform: translate(-2px, 2px); } 40% { clip-path: inset(50% 0 20% 0); transform: translate(2px, -2px); } }
        @keyframes glitch-2 { 0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); } 20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); } 40% { clip-path: inset(10% 0 60% 0); transform: translate(-2px, 2px); } }
    </style>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, useScroll, useTransform, AnimatePresence } = window.Motion;

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
            }, []);
            
            return (
                <motion.nav initial={{ y: -100 }} animate={{ y: 0 }} className={`fixed top-0 left-0 right-0 z-50 border-b-4 border-red transition-all duration-300 ${scrolled ? 'bg-black/95 py-3' : 'bg-transparent py-5'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <motion.div whileHover={{ scale: 1.05 }} className="font-display text-3xl tracking-widest">BURN <span className="text-red">BOXING</span></motion.div>
                        <motion.a href="tel:[PHONE]" whileHover={{ scale: 1.1, color: '#DC143C' }} className="font-bold">[PHONE]</motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            return (
                <section className="min-h-screen flex items-center justify-center relative overflow-hidden pt-20">
                    <div className="absolute inset-0 z-0">
                        <img src="../images/boxing-gym.jpg" className="w-full h-full object-cover opacity-40" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
                    </div>
                    
                    <div className="relative z-10 text-center px-6">
                        <motion.div initial={{ opacity: 0, scale: 0.5 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.8, type: "spring" }}>
                            <h1 className="font-display text-7xl md:text-9xl mb-4 glitch" data-text="TRAIN LIKE">TRAIN LIKE</h1>
                            <motion.h1 initial={{ x: -100, opacity: 0 }} animate={{ x: 0, opacity: 1 }} transition={{ delay: 0.3, duration: 0.6 }} className="font-display text-7xl md:text-9xl text-red mb-8">A FIGHTER</motion.h1>
                        </motion.div>
                        
                        <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.6 }} className="text-xl md:text-2xl text-gray-300 mb-12 max-w-2xl mx-auto">Boxing and fitness training in Craigieburn. All levels welcome. No experience needed.</p>
                        
                        <motion.a href="#contact" initial={{ y: 50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ delay: 0.8 }} whileHover={{ scale: 1.1, boxShadow: "0 0 30px rgba(220,20,60,0.5)" }} whileTap={{ scale: 0.95 }} className="inline-block bg-red text-white px-12 py-5 text-xl font-bold tracking-wider">START TRAINING</motion.a>
                    </div>
                </section>
            );
        };

        const Stats = () => {
            const stats = [
                { num: "4.8", label: "Google Rating" },
                { num: "33+", label: "Reviews" },
                { num: "CRAIGIEBURN", label: "Location" }
            ];
            
            return (
                <section className="py-16 bg-grey">
                    <div className="max-w-5xl mx-auto px-6">
                        <div className="grid md:grid-cols-3 gap-8">
                            {stats.map((stat, i) => (
                                <motion.div key={stat.label} initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.2 }} whileHover={{ scale: 1.1, y: -5 }} className="text-center">
                                    <motion.p initial={{ scale: 0 }} whileInView={{ scale: 1 }} viewport={{ once: true }} transition={{ delay: i * 0.2 + 0.3, type: "spring" }} className="font-display text-5xl text-red mb-2">{stat.num}</motion.p>
                                    <p className="text-gray-400 tracking-widest text-sm">{stat.label}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const WhyBoxing = () => {
            const benefits = [
                { title: "FULL BODY WORKOUT", desc: "Burn up to 800 calories per session" },
                { title: "STRESS RELIEF", desc: "Punch away the day's frustrations" },
                { title: "SELF DEFENSE", desc: "Learn practical skills while getting fit" },
                { title: "COMMUNITY", desc: "Train alongside motivated people" }
            ];

            return (
                <section className="py-24 px-6">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0, x: -50 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} className="font-display text-6xl mb-16 text-center">WHY <span className="text-red">BOXING?</span></motion.h2>
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            {benefits.map((b, i) => (
                                <motion.div key={b.title} initial={{ opacity: 0, x: i % 2 === 0 ? -50 : 50 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.1 }} whileHover={{ scale: 1.02, borderColor: '#DC143C' }} className="bg-grey p-8 border-2 border-transparent">
                                    <h3 className="font-display text-3xl text-red mb-3">{b.title}</h3>
                                    <p className="text-gray-400 text-lg">{b.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Classes = () => {
            const classes = [
                { name: "BOXING", desc: "Learn technique, combinations, and bag work. Suitable for beginners.", duration: "60 min" },
                { name: "HIIT", desc: "High-intensity intervals to build fitness and burn calories.", duration: "45 min" },
                { name: "STRENGTH", desc: "Resistance training to build power and conditioning.", duration: "60 min" },
                { name: "SPARRING", desc: "Controlled practice bouts for intermediate+ members.", duration: "90 min" }
            ];
            
            return (
                <section className="py-24 px-6 bg-grey">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-6xl mb-16 text-center">CLASS <span className="text-red">SCHEDULE</span></motion.h2>
                        
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {classes.map((cls, i) => (
                                <motion.div key={cls.name} initial={{ opacity: 0, rotateY: -90 }} whileInView={{ opacity: 1, rotateY: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.15, duration: 0.6 }} whileHover={{ scale: 1.05, y: -10 }} className="bg-black p-6 border-l-4 border-red">
                                    <span className="text-red font-bold text-sm tracking-wider">{cls.duration}</span>
                                    <h3 className="font-display text-3xl text-red my-3">{cls.name}</h3>
                                    <p className="text-gray-400 text-sm">{cls.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Trainers = () => {
            const trainers = [
                { name: "MIKE 'THE HAMMER'", role: "Head Coach", exp: "15 years pro boxing" },
                { name: "SARAH CHEN", role: "HIIT Specialist", exp: "Certified strength coach" },
                { name: "JAMES OKONKWO", role: "Boxing Coach", exp: "Former state champion" }
            ];

            return (
                <section className="py-24 px-6">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-6xl mb-16 text-center">MEET THE <span className="text-red">TEAM</span></motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {trainers.map((t, i) => (
                                <motion.div key={t.name} initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.2 }} whileHover={{ y: -10 }} className="bg-grey p-8 text-center">
                                    <div className="w-24 h-24 bg-red/20 rounded-full mx-auto mb-6 flex items-center justify-center">
                                        <span className="font-display text-3xl text-red">{t.name[0]}</span>
                                    </div>
                                    <h3 className="font-display text-2xl text-red mb-2">{t.name}</h3>
                                    <p className="text-white font-bold mb-1">{t.role}</p>
                                    <p className="text-gray-400 text-sm">{t.exp}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Testimonials = () => {
            const testimonials = [
                { name: "Alex M.", text: "Lost 20kg in 4 months. The energy here is unreal.", rating: 5 },
                { name: "Jessica T.", text: "Never thought I'd love boxing. Now I'm here 4x a week.", rating: 5 },
                { name: "Ryan K.", text: "Best gym in Craigieburn. Coaches actually care.", rating: 5 }
            ];

            return (
                <section className="py-24 px-6 bg-grey">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-6xl mb-16 text-center">MEMBER <span className="text-red">REVIEWS</span></motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {testimonials.map((t, i) => (
                                <motion.div key={t.name} initial={{ opacity: 0, scale: 0.9 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true }} transition={{ delay: i * 0.15 }} whileHover={{ scale: 1.05 }} className="bg-black p-8 border border-red/30">
                                    <div className="flex gap-1 mb-4">
                                        {[...Array(t.rating)].map((_, j) => <span key={j} className="text-red">★</span>)}
                                    </div>
                                    <p className="text-gray-300 mb-6 italic">"{t.text}"</p>
                                    <p className="text-red font-bold">— {t.name}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Pricing = () => {
            const plans = [
                { name: "CASUAL", price: "$25", period: "/session", features: ["All classes", "No lock-in", "Gym access"], popular: false },
                { name: "MEMBER", price: "$55", period: "/week", features: ["Unlimited classes", "Gym access", "Gloves included", "No lock-in"], popular: true },
                { name: "FIGHTER", price: "$85", period: "/week", features: ["Everything in Member", "1-on-1 session", "Nutrition plan", "Priority booking"], popular: false }
            ];

            return (
                <section className="py-24 px-6">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-6xl mb-16 text-center">MEMBERSHIP <span className="text-red">OPTIONS</span></motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {plans.map((plan, i) => (
                                <motion.div key={plan.name} initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.15 }} whileHover={{ y: -10 }} className={`p-8 ${plan.popular ? 'bg-red' : 'bg-grey'}`}>
                                    {plan.popular && <span className="inline-block bg-white text-red px-3 py-1 text-sm font-bold mb-4">MOST POPULAR</span>}
                                    
                                    <h3 className="font-display text-3xl mb-2">{plan.name}</h3>
                                    <div className="flex items-baseline mb-6">
                                        <span className="font-display text-5xl font-bold">{plan.price}</span>
                                        <span className="text-gray-400">{plan.period}</span>
                                    </div>
                                    
                                    <ul className="space-y-3 mb-8">
                                        {plan.features.map((f, j) => <li key={j} className="flex items-center gap-2"><span className={plan.popular ? "text-white" : "text-red"}>✓</span> {f}</li>)}
                                    </ul>
                                    
                                    <motion.a href="#contact" whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} className={`block text-center py-3 font-bold ${plan.popular ? 'bg-black text-white' : 'bg-red text-white'}`}>JOIN NOW</motion.a>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section className="py-24 bg-red text-center px-6">
                    <motion.div initial={{ scale: 0.9, opacity: 0 }} whileInView={{ scale: 1, opacity: 1 }} viewport={{ once: true }}>
                        <h2 className="font-display text-6xl mb-8">ABOUT <span className="text-black">BURN</span></h2>
                        <p className="text-xl max-w-3xl mx-auto mb-8">A boxing and fitness gym in Craigieburn built for people who want real results. No frills, hard work, supportive community. Whether you're here to lose weight, learn boxing, or compete — we've got you.</p>
                        
                        <div className="grid md:grid-cols-3 gap-8 max-w-4xl mx-auto mt-12">
                            {["No Lock-in Contracts", "Free Trial Class", "All Levels Welcome"].map((item, i) => (
                                <motion.div key={item} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.1 }} className="bg-black/20 p-6">
                                    <p className="font-display text-xl">{item}</p>
                                </motion.div>
                            ))}
                        </div>
                    </motion.div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="py-24 px-6 text-center relative overflow-hidden">
                    <motion.div animate={{ x: [0, 100, 0] }} transition={{ duration: 5, repeat: Infinity }} className="absolute top-10 right-0 w-64 h-64 bg-red/10 rounded-full blur-3xl"></motion.div>
                    
                    <div className="relative z-10 max-w-4xl mx-auto">
                        <motion.h2 initial={{ scale: 0.8, opacity: 0 }} whileInView={{ scale: 1, opacity: 1 }} viewport={{ once: true }} className="font-display text-6xl mb-8">JOIN THE <span className="text-red">GYM</span></motion.h2>
                        
                        <motion.a href="tel:[PHONE]" whileHover={{ scale: 1.1, backgroundColor: '#fff', color: '#DC143C' }} whileTap={{ scale: 0.95 }} className="inline-block bg-red text-white px-16 py-6 text-2xl font-bold">CALL NOW</motion.a>
                        
                        <p className="mt-8 text-gray-400">[PHONE] · Craigieburn, Melbourne</p>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-grey py-8 text-center">
                <p className="text-gray-500">© 2026 Burn Boxing & Fitness · Craigieburn</p>
            </footer>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <Stats />
                <WhyBoxing />
                <Classes />
                <Trainers />
                <Testimonials />
                <Pricing />
                <About />
                <Contact />
                <Footer />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
