<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lashkara Collections — South Asian Fashion Craigieburn</title>
    <meta name="description" content="Lashkara Collections in Craigieburn offers South Asian fashion including bridal, formal, and casual wear for Melbourne's community.">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { burgundy: '#722F37', gold: '#D4AF37', cream: '#FFF8E7' },
                    fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-cream">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const FloatingPetals = () => {
            const [petals, setPetals] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setPetals(prev => [...prev.slice(-8), { id: Date.now(), x: Math.random() * 100, delay: Math.random() * 2 }]);
                }, 1500);
                return () => clearInterval(interval);
            }, []);
            
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    <AnimatePresence>
                        {petals.map(petal => (
                            <motion.div
                                key={petal.id}
                                initial={{ opacity: 0, y: '110vh', x: `${petal.x}%`, rotate: 0 }}
                                animate={{ opacity: [0, 0.6, 0], y: '-10vh', rotate: 360, x: `${petal.x + (Math.random() * 20 - 10)}%` }}
                                exit={{ opacity: 0 }}
                                transition={{ duration: 10, ease: "linear", delay: petal.delay }}
                                className="absolute text-gold/30 text-3xl"
                            >
                                ❋
                            </motion.div>
                        ))}
                    </AnimatePresence>
                </div>
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
            }, []);
            
            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    className={`fixed top-0 left-0 right-0 z-50 transition-all ${scrolled ? 'bg-burgundy shadow-lg py-4' : 'bg-burgundy py-6'}`}
                >
                    <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                        <motion.div whileHover={{ scale: 1.02 }} className="font-serif text-2xl text-gold">Lashkara Collections</motion.div>
                        <motion.a href="tel:[PHONE]" whileHover={{ color: '#D4AF37' }} className="text-white font-medium">[PHONE]</motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            return (
                <section className="min-h-screen flex items-center bg-burgundy pt-24 relative overflow-hidden">
                    <FloatingPetals />
                    <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
                        <div>
                            <motion.div
                                initial={{ opacity: 0, y: 30 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 0.8 }}
                            >
                                <p className="text-gold tracking-widest text-sm mb-4">CRAIGIEBURN · 3.5★</p>
                                <h1 className="font-serif text-5xl md:text-6xl text-gold leading-tight mb-6">South Asian Fashion in Melbourne</h1>
                                <p className="text-xl text-white/80 mb-8">Elegant traditional and contemporary wear for women.</p>
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.05, backgroundColor: '#b8941f' }}
                                    whileTap={{ scale: 0.95 }}
                                    className="inline-block bg-gold text-burgundy px-10 py-4 rounded font-semibold text-lg"
                                >Visit Store</motion.a>
                            </motion.div>
                        </div>
                        <motion.div
                            initial={{ opacity: 0, scale: 0.9, rotate: 5 }}
                            animate={{ opacity: 1, scale: 1, rotate: 0 }}
                            transition={{ duration: 0.8, delay: 0.3 }}
                            className="relative"
                        >
                            <motion.div whileHover={{ scale: 1.02 }} className="overflow-hidden rounded-lg shadow-2xl">
                                <img src="../images/lashkara-hero.jpg" alt="South Asian fashion collection at Lashkara Collections" className="w-full h-[450px] object-cover hover:scale-110 transition-transform duration-700" />
                            </motion.div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Collections = () => {
            const collections = [
                { name: "Salwar Suits", desc: "Traditional and modern designs" },
                { name: "Dresses", desc: "Contemporary fusion wear" },
                { name: "Accessories", desc: "Jewelry, scarves, finishing touches" },
                { name: "Seasonal", desc: "Wedding and festival collections" }
            ];
            
            return (
                <section className="py-24 px-6 bg-white">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-serif text-4xl text-center mb-16 text-burgundy">Our Collections</motion.h2>
                        <div className="grid md:grid-cols-4 gap-6">
                            {collections.map((col, i) => (
                                <motion.div
                                    key={col.name}
                                    initial={{ opacity: 0, y: 30 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.1 }}
                                    whileHover={{ y: -10, boxShadow: "0 20px 40px rgba(114,47,55,0.2)" }}
                                    className="p-8 bg-cream rounded-lg text-center border-t-4 border-gold"
                                >
                                    <h3 className="font-serif text-xl text-burgundy mb-2">{col.name}</h3>
                                    <p className="text-gray-600 text-sm">{col.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-24 bg-burgundy text-center">
                <motion.div initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}>
                    <h2 className="font-serif text-4xl text-gold mb-8">Visit Us</h2>
                    <motion.a
                        href="tel:[PHONE]"
                        whileHover={{ scale: 1.05 }}
                        whileTap={{ scale: 0.95 }}
                        className="inline-block bg-gold text-burgundy px-12 py-5 rounded font-semibold text-lg"
                    >Call Now</motion.a>
                    <p className="mt-8 text-white/60">[PHONE] · Craigieburn, Melbourne</p>
                </motion.div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <Collections />
                <Contact />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
