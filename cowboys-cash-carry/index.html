<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowboys Cash & Carry — Workwear Thomastown</title>
    <meta name="description" content="Cowboys Cash and Carry in Thomastown supplies quality workwear, boots, and safety gear for tradies across Melbourne. Rated 4.5 stars.">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { rust: '#8B4513', tan: '#D2B48C', dark: '#1a1a1a' },
                    fontFamily: { display: ['Oswald', 'sans-serif'], body: ['Roboto Condensed', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, useScroll, useTransform } = window.Motion;

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
            }, []);
            
            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    className={`fixed top-0 left-0 right-0 z-50 border-b-4 border-rust transition-all ${scrolled ? 'bg-dark py-3' : 'bg-dark/90 py-5'}`}
                >
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <motion.div whileHover={{ scale: 1.05 }} className="font-display text-2xl text-tan tracking-wider"
                        >COWBOYS <span className="text-rust">CASH & CARRY</span></motion.div>
                        <motion.a href="tel:[PHONE]" whileHover={{ color: '#D2B48C' }} className="text-tan font-bold">[PHONE]</motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            const { scrollY } = useScroll();
            const y = useTransform(scrollY, [0, 500], [0, 150]);
            
            return (
                <section className="min-h-screen flex items-center relative overflow-hidden pt-24">
                    <motion.div style={{ y }} className="absolute inset-0 z-0">
                        <img src="../images/cowboys-hero.jpg" alt="Cowboys Cash and Carry workwear store" className="w-full h-full object-cover opacity-30" />
                        <div className="absolute inset-0 bg-gradient-to-r from-dark via-dark/80 to-transparent" />
                    </motion.div>
                    
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
                        <div>
                            <motion.div
                                initial={{ opacity: 0, x: -50 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ duration: 0.8 }}
                            >
                                <p className="text-rust font-display text-xl tracking-widest mb-4">THOMASTOWN · 4.5★</p>
                                
                                <h1 className="font-display text-6xl md:text-7xl text-tan leading-none mb-6">WORK BOOTS<br/><span className="text-rust">THAT LAST</span></h1>
                                
                                <p className="text-xl text-gray-400 mb-8">Quality workwear, boots, and gear for tradies across Melbourne's north.</p>
                                
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.05, backgroundColor: '#fff', color: '#000' }}
                                    whileTap={{ scale: 0.95 }}
                                    className="inline-block bg-rust text-white px-10 py-4 font-display text-xl tracking-wider"
                                >VISIT STORE</motion.a>
                            </motion.div>
                        </div>
                        
                        <motion.div
                            initial={{ opacity: 0, rotateY: 45 }}
                            animate={{ opacity: 1, rotateY: 0 }}
                            transition={{ duration: 1, delay: 0.3 }}
                            className="hidden md:block"
                        >
                            <motion.div
                                whileHover={{ rotateY: 10, rotateX: -5 }}
                                transition={{ type: "spring" }}
                                className="relative"
                            >
                                <div className="absolute -inset-4 border-4 border-rust/30" />
                                <img src="../images/cowboys-hero.jpg" alt="Quality workwear and boots at Cowboys Cash and Carry" className="relative w-full h-[500px] object-cover border-4 border-rust" />
                            </motion.div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Products = () => {
            const products = [
                { name: "Work Boots", items: ["Steel cap safety", "Composite toe", "Waterproof", "Slip-resistant"] },
                { name: "Workwear", items: ["Hi-vis shirts", "Work shorts", "Jackets", "Trade gear"] },
                { name: "Accessories", items: ["Hard hats", "Safety glasses", "Tool belts", "Socks"] }
            ];
            
            return (
                <section className="py-24 px-6 bg-white">
                    <div className="max-w-6xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-5xl text-dark mb-16 text-center"
                        >WHAT WE <span className="text-rust">STOCK</span></motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-8">
                            {products.map((p, i) => (
                                <motion.div
                                    key={p.name}
                                    initial={{ opacity: 0, y: 50 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.2 }}
                                    whileHover={{ y: -10 }}
                                    className="bg-stone-50 p-8 border-t-4 border-rust shadow-lg"
                                >
                                    <h3 className="font-display text-2xl text-rust mb-6">{p.name}</h3>
                                    <ul className="space-y-3">
                                        {p.items.map((item, j) => (
                                            <motion.li
                                                key={item}
                                                initial={{ opacity: 0, x: -20 }}
                                                whileInView={{ opacity: 1, x: 0 }}
                                                viewport={{ once: true }}
                                                transition={{ delay: i * 0.2 + j * 0.1 }}
                                                className="text-gray-600 border-b border-gray-200 pb-2"
                                            >
                                                {item}
                                            </motion.li>
                                        ))}
                                    </ul>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-24 bg-rust text-center">
                <motion.div initial={{ scale: 0.9 }} whileInView={{ scale: 1 }} viewport={{ once: true }}>
                    <h2 className="font-display text-5xl text-white mb-8">VISIT THE STORE</h2>
                    
                    <motion.a
                        href="tel:[PHONE]"
                        whileHover={{ scale: 1.1, backgroundColor: '#1a1a1a', color: '#fff' }}
                        whileTap={{ scale: 0.95 }}
                        className="inline-block bg-white text-rust px-12 py-5 font-display text-xl"
                    >CALL NOW</motion.a>
                    
                    <p className="mt-8 text-white/80">[PHONE] · Thomastown, Melbourne</p>
                </motion.div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <Products />
                <Contact />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
