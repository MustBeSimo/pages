<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucebox Fitness — Functional Training Richmond</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { neon: '#00D9FF', dark: '#0A0A0F', grey: '#1A1A24' },
                    fontFamily: { display: ['Teko', 'sans-serif'], body: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Rajdhani', sans-serif; }</style>
</head>
<body class="bg-dark text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, useMotionValue, useTransform } = window.Motion;

        const GlitchText = ({ text }) => {
            const [display, setDisplay] = useState(text);
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            
            useEffect(() => {
                let i = 0;
                const interval = setInterval(() => {
                    setDisplay(text.split("").map((char, idx) => 
                        idx < i ? char : chars[Math.floor(Math.random() * chars.length)]
                    ).join(""));
                    i += 1/3;
                    if (i >= text.length) clearInterval(interval);
                }, 30);
                return () => clearInterval(interval);
            }, [text]);
            
            return <span className="font-display">{display}</span>;
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
            }, []);
            
            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    className={`fixed top-0 left-0 right-0 z-50 border-b-2 border-neon transition-all ${scrolled ? 'bg-dark/95 py-3' : 'bg-transparent py-5'}`}
                >
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <motion.div whileHover={{ scale: 1.05, textShadow: "0 0 20px #00D9FF" }} className="font-display text-3xl text-neon tracking-widest">
                            UCEBOX
                        </motion.div>
                        <motion.a href="tel:[PHONE]" whileHover={{ color: '#00D9FF' }} className="font-bold text-xl">[PHONE]</motion.a>
                    </div>
                </motion.nav>
            );
        };

        const Hero = () => {
            const mouseX = useMotionValue(0);
            const mouseY = useMotionValue(0);
            const rotateX = useTransform(mouseY, [-300, 300], [10, -10]);
            const rotateY = useTransform(mouseX, [-300, 300], [-10, 10]);
            
            const handleMouseMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                mouseX.set(e.clientX - rect.left - rect.width / 2);
                mouseY.set(e.clientY - rect.top - rect.height / 2);
            };

            return (
                <section 
                    className="min-h-screen flex items-center pt-24 relative overflow-hidden"
                    onMouseMove={handleMouseMove}
                >
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_#1A1A24_0%,_#0A0A0F_100%)]" />
                    
                    {[...Array(20)].map((_, i) => (
                        <motion.div
                            key={i}
                            className="absolute w-1 h-1 bg-neon/30 rounded-full"
                            style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`
                            }}
                            animate={{
                                opacity: [0.2, 1, 0.2],
                                scale: [1, 2, 1]
                            }}
                            transition={{
                                duration: 2 + Math.random() * 2,
                                repeat: Infinity,
                                delay: Math.random() * 2
                            }}
                        />
                    ))}
                    
                    <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
                        <div>
                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ duration: 0.5 }}
                            >
                                <p className="font-display text-neon text-xl tracking-widest mb-4">RICHMOND // 5.0★</p>
                                
                                <h1 className="font-display text-6xl md:text-8xl leading-none mb-6">
                                    <GlitchText text="FUNCTIONAL" /><br/>
                                    <span className="text-neon"><GlitchText text="FITNESS" /></span>
                                </h1>
                                
                                <p className="text-xl text-gray-400 mb-8">High-intensity training. Build strength, endurance, performance.</p>
                                
                                <motion.a
                                    href="#contact"
                                    whileHover={{ scale: 1.05, boxShadow: "0 0 30px rgba(0,217,255,0.5)" }}
                                    whileTap={{ scale: 0.95 }}
                                    className="inline-block bg-neon text-dark px-10 py-4 font-display text-xl tracking-wider"
                                >START TRAINING</motion.a>
                            </motion.div>
                        </div>
                        
                        <motion.div
                            style={{ rotateX, rotateY }}
                            className="relative"
                        >
                            <motion.div
                                animate={{ boxShadow: ["0 0 20px rgba(0,217,255,0.3)", "0 0 60px rgba(0,217,255,0.5)", "0 0 20px rgba(0,217,255,0.3)"] }}
                                transition={{ duration: 2, repeat: Infinity }}
                                className="rounded-lg overflow-hidden border-2 border-neon"
                            >
                                <img src="../images/fitness-training.jpg" className="w-full h-[400px] object-cover" />
                            </motion.div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Training = () => {
            const options = [
                { name: "HIIT", desc: "Maximum results, minimum time" },
                { name: "STRENGTH", desc: "Barbells, kettlebells, bodyweight" },
                { name: "CONDITIONING", desc: "Build engine and endurance" }
            ];
            
            return (
                <section className="py-24 px-6 bg-grey">
                    <div className="max-w-5xl mx-auto">
                        <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="font-display text-5xl text-neon mb-16 text-center tracking-wider">
                            TRAINING OPTIONS
                        </motion.h2>
                        
                        <div className="grid md:grid-cols-3 gap-6">
                            {options.map((opt, i) => (
                                <motion.div
                                    key={opt.name}
                                    initial={{ opacity: 0, y: 30 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ delay: i * 0.1 }}
                                    whileHover={{ scale: 1.05, borderColor: '#00D9FF' }}
                                    className="p-8 border-l-4 border-neon bg-dark cursor-pointer transition-all"
                                >
                                    <h3 className="font-display text-3xl text-neon mb-3">{opt.name}</h3>
                                    <p className="text-gray-400">{opt.desc}</p>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => (
            <section id="contact" className="py-24 text-center relative overflow-hidden">
                <motion.div
                    animate={{ rotate: 360 }}
                    transition={{ duration: 30, repeat: Infinity, ease: "linear" }}
                    className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-neon/20 rounded-full"
                />
                
                <div className="relative z-10">
                    <motion.h2 initial={{ scale: 0.8 }} whileInView={{ scale: 1 }} viewport={{ once: true }} className="font-display text-6xl text-neon mb-8 tracking-wider">
                        JOIN NOW
                    </motion.h2>
                    
                    <motion.a
                        href="tel:[PHONE]"
                        whileHover={{ scale: 1.1 }}
                        whileTap={{ scale: 0.95 }}
                        className="inline-block bg-neon text-dark px-12 py-5 font-display text-xl"
                    >
                        CALL NOW
                    </motion.a>
                </div>
            </section>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <Training />
                <Contact />
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
